---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://mmarini.org/wheelly/qrcode-schema-0.1
title: Wheelly camera schema

# qrcode schema
type: object
properties:
  $schema:
    type: string
    const: https://mmarini.org/wheelly/qrcode-schema-0.1
  cameraUrl:
    type: string
  frameSize:
    type: integer
    multipleOf: 1
    minimum: 0
    maximum: 13
  ledIntensity:
    type: integer
    multipleOf: 1
    minimum: 0
    maximum: 255
  syncInterval:
    type: integer
    multipleOf: 1
    minimum: 1
  captureInterval:
    type: integer
    multipleOf: 1
    minimum: 1
  retryInterval:
    type: integer
    multipleOf: 1
    minimum: 1
  port:
    type: integer
    multipleOf: 1
    minimum: 1
required:
  - $schema
  - cameraUrl
