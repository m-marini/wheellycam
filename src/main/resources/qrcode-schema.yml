---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://mmarini.org/wheelly/qrcode-schema-0.4
title: Wheelly camera schema
# qrcode schema
type: object
properties:
  $schema:
    type: string
    const: https://mmarini.org/wheelly/qrcode-schema-0.4
  retryInterval:
    type: integer
    minimum: 1
  brokerUrl:
    type: string
  mqttUser:
    type: string
  mqttPassword:
    type: string
  deviceId:
    type: string
  deviceName:
    type: string
  deviceVersion:
    type: string
  cameraId:
    type: string
  cameraName:
    type: string
  cameraVersion:
    type: string
  cameraInterval:
    type: integer
    minimum: 1
  configureTimeout:
    type: integer
    minimum: 1
  frameSize:
    type: integer
    minimum: 0
    maximum: 12
  ledIntensity:
    type: integer
    minimum: 0
    maximum: 255
required:
  - $schema
  - mqttUser
  - mqttPassword
  - cameraId
