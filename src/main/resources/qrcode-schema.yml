---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://mmarini.org/wheelly/qrcode-schema-0.3
title: Wheelly camera schema

# qrcode schema
type: object
properties:
  $schema:
    type: string
    const: https://mmarini.org/wheelly/qrcode-schema-0.3
  retryInterval:
    type: integer
    minimum: 1
  brokerUrl:
    type: string
  mqttUser:
    type: string
  mqttPassword:
    type: string
  deviceId:
    type: string
  deviceName:
    type: string
  deviceVersion:
    type: string
  cameraId:
    type: string
  cameraName:
    type: string
  cameraVersion:
    type: string
required:
  - $schema
  - mqttUser
  - mqttPassword
  - cameraId
